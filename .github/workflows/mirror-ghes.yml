name: Mirror to GHES

# Copies `main` and the tags to the A*STAR GitHub Enterprise Server after every
# merge. github.com stays the main repository: issues, pull requests and CI
# live here, and the GHES copy is read-only for everyone except this job.
#
# Needs the repository secret GHES_MIRROR_TOKEN: a GHES personal access token
# (classic) with the `repo` and `workflow` scopes. `workflow` is required
# because the mirrored commits contain files under .github/workflows/.
#
# The push is never forced. If someone commits directly on the GHES copy, this
# job fails and shows it, and the copy is left untouched.

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-ghes
  cancel-in-progress: false

env:
  GHES_URL: https://ghes.a-star.edu.sg/juar/mliprun.git
  GHES_API: https://ghes.a-star.edu.sg/api/v3

jobs:
  mirror:
    # Skip in forks and in the GHES copy itself.
    if: github.repository == 'manuelarcer/mliprun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and all tags
        run: git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"

      # Tells apart the three ways this job can fail: the GHES refuses this
      # runner (network), the token is invalid or expired, or the token lacks
      # a scope. Without it, all three show only as "error: 403" on the push.
      - name: Check the GHES connection and the token
        env:
          GHES_MIRROR_TOKEN: ${{ secrets.GHES_MIRROR_TOKEN }}
        run: |
          if [ -z "$GHES_MIRROR_TOKEN" ]; then
            echo "::error::Secret GHES_MIRROR_TOKEN is not set; nothing was mirrored."
            exit 1
          fi
          anon=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$GHES_API/meta" || true)
          echo "Anonymous request to the GHES: HTTP $anon"
          if [ "$anon" != "200" ]; then
            echo "::error::The GHES does not accept connections from this runner (HTTP $anon). This is a network block, not a token problem."
            exit 1
          fi
          code=$(curl -s -o "$RUNNER_TEMP/user.json" -D "$RUNNER_TEMP/user.headers" \
            -w '%{http_code}' --max-time 20 \
            -H "Authorization: token $GHES_MIRROR_TOKEN" "$GHES_API/user" || true)
          echo "Request with the token: HTTP $code"
          grep -i '^x-oauth-scopes:' "$RUNNER_TEMP/user.headers" || echo "x-oauth-scopes: (header absent)"
          if [ "$code" != "200" ]; then
            echo "GHES message: $(jq -r '.message // "(none)"' "$RUNNER_TEMP/user.json" 2>/dev/null || echo unreadable)"
            echo "::error::The GHES rejected the token (HTTP $code). Create a new classic token with the repo and workflow scopes and replace the secret."
            exit 1
          fi
          echo "Token belongs to: $(jq -r '.login' "$RUNNER_TEMP/user.json")"

      - name: Push main and tags to GHES
        env:
          GHES_MIRROR_TOKEN: ${{ secrets.GHES_MIRROR_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GHES_MIRROR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraheader=Authorization: Basic $auth" \
            push "$GHES_URL" "refs/remotes/origin/main:refs/heads/main" --tags
