# Showcase committee: the OC20-level trio on cos-cluster (CANON C1 in
# docs/showcase/CANON.md). Format follows examples/committee.yaml.
#
#   mlip optimize run --structure POSCAR --committee committee.yaml --fmax 0.02
#
# All members share one GPU card (CANON K-p1). CAUTION: `gpu: N` OVERWRITES
# CUDA_VISIBLE_DEVICES in each member's process (core/committee/remote.py),
# so `gpu: 0` means PHYSICAL card 0, whatever the launcher exported. If card 0
# is busy at launch, change all three values to the free card (or delete the
# `gpu` lines so members inherit the launcher's CUDA_VISIBLE_DEVICES).
# mliprun itself comes from the 2b3044b copy through PYTHONPATH (see
# cluster.env), not from the envs' own editable install.

members:
  - env:  /scratchb/juar/EWaste2GreenCat/explicit_solvation/.venv/uma
    mlip: uma-s-1p2
    uma_task: oc20
    gpu: 0

  - env:  /scratchb/juar/EWaste2GreenCat/explicit_solvation/.venv/sevenn
    mlip: 7net-omni
    sevennet_task: oc20
    gpu: 0

  - env:  /scratchb/juar/EWaste2GreenCat/explicit_solvation/.venv/mace
    mlip: mace-mh-1
    mace_head: oc20_usemppbe
    gpu: 0
