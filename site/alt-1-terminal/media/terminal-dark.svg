<text class="ln" x="18" y="318" fill="#e2e8ee" xml:space="preserve" style="animation-delay:4.79s">Step   45  Fmax: 0.017678 eV/A  Barrier: 0.544238 eV</text>
<text class="ln" x="18" y="335" fill="#94a0ad" font-style="italic" xml:space="preserve" style="animation-delay:4.87s"># not shown: 5 min 56 s (results, TS verification)</text>
<text class="ln" x="18" y="352" fill="#5cc28a" xml:space="preserve" style="animation-delay:5.18s">TS verification: verified</text>
<text class="ln" x="18" y="369" fill="#e2e8ee" xml:space="preserve" style="animation-delay:5.24s">Imaginary modes: 1 (128.3i cm⁻¹)</text>
<text class="ln" x="18" y="386" fill="#e2e8ee" xml:space="preserve" style="animation-delay:5.30s">TS fmax (free components): 0.0123 eV/Å (limit 0.0300)</text>
