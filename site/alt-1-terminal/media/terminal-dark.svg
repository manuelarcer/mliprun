<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-label="Animated terminal: mlip neb run with --verify-ts both on O fcc to hcp on Pt(111); real log lines and the resulting image-energy profile">
<style>
  .ln, .pop { animation: show .01s step-end backwards; }
  .type { transform-box: fill-box; transform-origin: right center;
           animation-name: type; animation-fill-mode: backwards; transform: scaleX(0); }
  .draw { animation: draw 1.6s ease-out backwards; stroke-dashoffset: 0; }
  @keyframes show { from { opacity: 0 } to { opacity: 1 } }
  @keyframes type { from { transform: scaleX(1) } to { transform: scaleX(0) } }
  @keyframes draw { from { stroke-dashoffset: var(--len, 1200) } to { stroke-dashoffset: 0 } }
  @media (prefers-reduced-motion: reduce) { .ln, .pop, .type, .draw { animation: none !important; } }
</style>
<rect width="960" height="444" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="8" y="8" width="582" height="428" rx="7" fill="#11161d" stroke="#30363d"/>
<text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a0ad">ran on cos-cluster  …/juar/mliprun-showcase/03_neb   ·   real output, excerpted</text>
<line x1="8" x2="590" y1="38" y2="38" stroke="#30363d"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.6">
<g><text x="18" y="63" fill="#e2e8ee" xml:space="preserve">$ …/uma/bin/mlip neb run \</text><rect class="type" x="18" y="50" width="560" height="17" fill="#11161d" style="animation-duration:0.29s;animation-delay:0.40s;animation-timing-function:steps(26)"/></g>
<g><text x="18" y="80" fill="#e2e8ee" xml:space="preserve">    --initial o_fcc/opt_final.vasp --final o_hcp/opt_final.vasp \</text><rect class="type" x="18" y="67" width="560" height="17" fill="#11161d" style="animation-duration:0.71s;animation-delay:0.74s;animation-timing-function:steps(65)"/></g>
<g><text x="18" y="97" fill="#e2e8ee" xml:space="preserve">    --mlip uma-s-1p2 --uma-task oc20 --device cuda \</text><rect class="type" x="18" y="84" width="560" height="17" fill="#11161d" style="animation-duration:0.57s;animation-delay:1.50s;animation-timing-function:steps(52)"/></g>
<g><text x="18" y="114" fill="#e2e8ee" xml:space="preserve">    --num-images 7 --k 0.1 --climb --fmax 0.02 \</text><rect class="type" x="18" y="101" width="560" height="17" fill="#11161d" style="animation-duration:0.53s;animation-delay:2.12s;animation-timing-function:steps(48)"/></g>
<g><text x="18" y="131" fill="#e2e8ee" xml:space="preserve">    --optimize-endpoints --endpoint-fmax 0.02 \</text><rect class="type" x="18" y="118" width="560" height="17" fill="#11161d" style="animation-duration:0.52s;animation-delay:2.70s;animation-timing-function:steps(47)"/></g>
<g><text x="18" y="148" fill="#e2e8ee" xml:space="preserve">    --endpoint-optimizer bfgs --verify-ts both --plot</text><rect class="type" x="18" y="135" width="560" height="17" fill="#11161d" style="animation-duration:0.58s;animation-delay:3.27s;animation-timing-function:steps(53)"/></g>
<text class="ln" x="18" y="165" fill="#94a0ad" xml:space="preserve" style="animation-delay:4.15s">Using MLIP: uma-s-1p2</text>
<text class="ln" x="18" y="182" fill="#94a0ad" font-style="italic" xml:space="preserve" style="animation-delay:4.21s"># not shown: 2 min 7 s of model load, endpoint relaxation and IDPP</text>
<text class="ln" x="18" y="199" fill="#94a0ad" xml:space="preserve" style="animation-delay:4.27s">Running NEB optimization (optimizer=FIRE, climb=True, max_steps=600)...</text>
